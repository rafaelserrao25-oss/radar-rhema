name: Atualizar Radar Rhema

on:
  schedule:
    # A coleta leva ~45 min e o GitHub às vezes atrasa o início em 10-15 min.
    # Começa 1 hora antes para a lista estar pronta às 10h e às 16h.
    - cron: "0 12 * * *"  # 09h00 de Brasília -> pronta antes das 10h
    - cron: "0 18 * * *"  # 15h00 de Brasília -> pronta antes das 16h
  workflow_dispatch: {}    # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar licitações do PNCP
        run: python coletar.py
      - name: Publicar dados
        run: |
          git config user.name "Radar Rhema"
          git config user.email "radar@users.noreply.github.com"
          git add docs/dados.json municipios.csv
          git diff --cached --quiet || git commit -m "Atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # se alguém mexeu no repositório durante a coleta, junta antes de gravar
          git pull --rebase -X theirs origin main
          git push
